name: Retrain Model

# 일일 수집(update_data.yml)이 새 데이터를 커밋한 날에만 그 워크플로우가 이 워크플로우를
# 실행한다(수동 실행도 가능). 비시즌엔 새 데이터가 없어 돌지 않는다.
# 학습 후 PR을 올리고, 같은 테스트 세트에서 현재 배포 모델보다 정확도가 0.5%p 넘게
# 떨어지지 않으면 자동 머지한다(떨어지면 PR만 남겨 사람이 검토).
on:
  workflow_dispatch: {}

concurrency:
  group: retrain
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 완결 시즌(2024·2025) 원본은 바뀌지 않으므로 캐시해 매번 다시 받지 않는다
      - uses: actions/cache@v4
        with:
          path: desktop_app/data
          key: statcast-complete-seasons-${{ hashFiles('desktop_app/src/data_loader.py') }}

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn matplotlib pybaseball tensorflow-cpu==2.20.0

      - name: Train model (downloads TRAIN_SEASONS, trains, saves artifacts)
        working-directory: desktop_app/src
        run: python train.py

      - name: Package artifacts and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp desktop_app/model/pitch_model.h5 backend/model/pitch_model.h5
          cp desktop_app/model/scaler.pkl backend/model/scaler.pkl
          cp desktop_app/model/label_encoder.pkl backend/model/label_encoder.pkl
          cp desktop_app/results/confusion_matrix.png results/confusion_matrix.png
          cp desktop_app/results/loss_accuracy.png results/loss_accuracy.png

          BRANCH="model/auto-retrain-$(date -u +%Y%m%d)-${{ github.run_number }}"
          git checkout -b "$BRANCH"
          git add backend/model/ results/
          if git diff --cached --quiet; then
            echo "No change from current model, nothing to open a PR for."
            exit 0
          fi
          git commit -m "Auto-retrain: model refresh $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"

          METRICS=$(cat desktop_app/results/metrics.md 2>/dev/null || echo "메트릭 요약을 찾을 수 없습니다 — 실행 로그를 확인하세요.")
          gh pr create --title "🤖 자동 재학습: 모델 갱신 $(date -u +%Y-%m-%d)" --body "$(cat <<EOF
          새 데이터 수집 후 자동 실행된 재학습 결과입니다. 같은 테스트 세트에서 현재 배포 모델보다 정확도가 0.5%p 넘게 떨어지지 않으면 자동 머지되고, 떨어지면 이 PR이 열린 채로 남습니다 — 그때는 아래 지표와 confusion_matrix.png/loss_accuracy.png를 검토해주세요.

          $METRICS

          ⚠️ metrics.md 수치는 랜덤 분할 기준. README·streamlit_app/app.py의 수치는 투수 단위 5-fold 기준이라 scripts/의 평가 스크립트(scripts/eval_groupkfold.py)로 다시 평가해 갱신할 것.
          EOF
          )"

          # 이전에 열려 있던 자동 재학습 PR은 이번 PR로 대체
          gh pr list --state open --json number,headRefName --jq ".[] | select(.headRefName | startswith(\"model/auto-retrain-\")) | select(.headRefName != \"$BRANCH\") | .number" |
            while read -r N; do gh pr close "$N" --delete-branch --comment "새 재학습 PR로 대체"; done

          # 자동 머지 게이트
          . desktop_app/results/gate.env
          if [ -z "$BASE_ACC" ]; then
            echo "배포 모델과 비교할 수 없음(구종 구성 변경 등) → PR만 남김"
          elif python -c "import sys; sys.exit(0 if $NEW_ACC >= $BASE_ACC - 0.005 else 1)"; then
            echo "새 $NEW_ACC >= 배포 $BASE_ACC - 0.005 → 자동 머지"
            gh pr merge "$BRANCH" --merge --delete-branch
          else
            gh pr comment "$BRANCH" --body "자동 머지 보류: 새 모델 $NEW_ACC < 배포 모델 $BASE_ACC - 0.005"
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔴 재학습 실패"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "다시 실패했습니다: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "워크플로우 실행이 실패했습니다: $RUN_URL"
          fi
