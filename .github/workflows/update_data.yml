name: Update Statcast Data

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 UTC 21:00 = KST 06:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pybaseball

      - name: Fetch yesterday's Statcast data
        run: python scripts/fetch_daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "chore: update statcast data ($(date -u +%Y-%m-%d))"
            git push
          fi
