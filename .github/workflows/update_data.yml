name: Update Statcast Data

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 UTC 21:00 = KST 06:00
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pybaseball

      - name: Fetch yesterday's Statcast data
        run: python scripts/fetch_daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "chore: update statcast data ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              git push && exit 0
              echo "Push rejected (attempt $i) -- rebasing onto latest main and retrying..."
              git pull --rebase origin main
            done
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔴 일일 데이터 수집 실패"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "다시 실패했습니다: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "워크플로우 실행이 실패했습니다: $RUN_URL"
          fi
